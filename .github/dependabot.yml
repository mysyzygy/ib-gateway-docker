version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directories:
      - /
      - /latest
      - /stable
    schedule:
      interval: weekly
    groups:
      docker:
        patterns:
          - "*"
    ignore:
      # not built by this fork (TWS image); rdesktop base is on lscr.io
      - dependency-name: "lscr.io/linuxserver/rdesktop"
      - dependency-name: "ghcr.io/mysyzygy/ib-gateway"
